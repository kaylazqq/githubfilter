name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install pinned tooling
        run: python -m pip install --require-hashes -r requirements-tools.txt
      - name: Configure test Git identity
        run: |
          git config --global user.name "githubfilter CI"
          git config --global user.email "githubfilter-ci@invalid"
      - name: Run tests
        run: python -m unittest discover -s tests -v
