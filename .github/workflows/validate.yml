name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install pinned tooling
        run: python -m pip install --require-hashes -r requirements-tools.txt
      - name: Configure test Git identity
        run: |
          git config --global user.name "githubfilter CI"
          git config --global user.email "githubfilter-ci@invalid"
      - name: Run tests
        run: python -m unittest discover -s tests -v
